<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clear Dark Sky Forecast</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #ddd;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }
        h1 {
            margin: 24px 0 16px;
            font-weight: normal;
        }
        .chart-container {
            max-width: 1000px;
            width: 100%;
            padding: 0 16px 32px;
            box-sizing: border-box;
            text-align: center;
        }
        .chart-container img {
            max-width: 100%;
            height: auto;
            border: 0;
        }
        .hint {
            margin-top: 12px;
            font-size: 0.9rem;
            color: #aaa;
        }
    </style>
</head>
<body>
    <h1>Clear Dark Sky Forecast</h1>

    <div class="chart-container">
        <a href="https://www.cleardarksky.com/c/CntrvllVAkey.html" target="_blank" rel="noopener noreferrer">
            <img
                src="https://www.cleardarksky.com/c/CntrvllVAcsk.gif?c=856850"
                alt="Clear Dark Sky Chart Centreville"
            >
        </a>
        <div class="hint">Click the chart to open the full forecast</div>
    </div>

    <h2>Clear Dark Sky Forecast</h2>

    <div class="chart-container">
        <a href="https://www.cleardarksky.com/c/VnnVAkey.html" target="_blank" rel="noopener noreferrer">
            <img
                src="https://www.cleardarksky.com/c/VnnVAcsk.gif?c=986433"
                alt="Clear Dark Sky Chart Vienna"
            >
        </a>
        <div class="hint">Click the chart to open the full forecast</div>
    </div>

    <div style="font-family: sans-serif; max-width: 600px; margin: 20px auto;">

    <h3 style="text-align: center; margin-bottom: 10px; color: #333;">
        Near-Realtime Cloud Satellite-Imagry (Vienna/Tysons, VA)
    </h3>

    <div style="position: relative; width: 600px; height: 600px; background: #000; border: 1px solid #ccc; overflow: hidden;">
        
        <img src="https://cdn.star.nesdis.noaa.gov/GOES19/ABI/SECTOR/ne/DayNightCloudMicroCombo/GOES19-NE-DayNightCloudMicroCombo-600x600.gif" 
             alt="NOAA GOES Satellite Map" 
             style="display: block; width: 600px; height: 600px; border: none;">

        <div style="
            position: absolute;
            left: 215px; 
            top: 358px;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            box-shadow: 0 0 4px rgba(0,0,0,0.4);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;">
            <div style="position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: rgba(255, 255, 255, 0.7); transform: translate(-50%, -50%); border-radius: 50%;"></div>
        </div>

    </div>


</div>
    
</body>
</html>
